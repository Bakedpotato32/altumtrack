<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Track Cyan Gradient -->
    <linearGradient id="trackGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Soft Glass Drop Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem Badge -->
  <g filter="url(#badgeShadow)">
    <rect x="10" y="10" width="80" height="80" rx="24" fill="url(#shieldGrad)"/>
    <rect x="10.75" y="10.75" width="78.5" height="78.5" rx="23.25" stroke="white" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Academic Cap / Dynamic Arrow Crest -->
    <path d="M50 28 L74 40 L50 52 L26 40 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M35 46.5 L35 59 C35 67 65 67 65 59 L65 46.5 L50 54 Z" fill="#ffffff" fill-opacity="0.82"/>

    <!-- Gold Dynamic Track Chevron -->
    <path d="M50 63 L61 57 L64 61 L50 69 L36 61 L39 57 Z" fill="url(#goldGrad)"/>
    <!-- Gold Tassel Bead -->
    <circle cx="68" cy="44" r="3" fill="url(#goldGrad)"/>
    <path d="M68 46 L70 56" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography: ALTUM TRACK -->
  <text x="108" y="58" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5" fill="#0f172a">
    ALTUM<tspan fill="url(#trackGrad)">TRACK</tspan>
  </text>

  <!-- Subtitle Pill / Micro Badge -->
  <rect x="110" y="68" width="86" height="18" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="153" y="80.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="9" fill="#1d4ed8" text-anchor="middle" letter-spacing="1">
    SCHOOL ERP
  </text>

  <!-- Sparkle Accent Icon -->
  <path d="M380 32 L382 38 L388 40 L382 42 L380 48 L378 42 L372 40 L378 38 Z" fill="#f59e0b"/>
</svg>
