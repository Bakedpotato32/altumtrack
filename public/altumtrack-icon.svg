<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="goldIcon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4f46e5" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <g filter="url(#iconGlow)">
    <rect x="12" y="12" width="176" height="176" rx="52" fill="url(#iconBg)"/>
    <rect x="13.5" y="13.5" width="173" height="173" rx="50.5" stroke="white" stroke-opacity="0.3" stroke-width="3"/>
  </g>

  <!-- Academic Diamond Cap -->
  <path d="M100 46 L150 72 L100 98 L50 72 Z" fill="#ffffff"/>
  <!-- Cap Underside -->
  <path d="M68 85 L68 108 C68 126 132 126 132 108 L132 85 L100 102 Z" fill="#ffffff" fill-opacity="0.85"/>

  <!-- Golden Track Ribbon -->
  <path d="M100 114 L122 102 L128 110 L100 126 L72 110 L78 102 Z" fill="url(#goldIcon)"/>
  <!-- Gold Tassel -->
  <circle cx="138" cy="80" r="6" fill="url(#goldIcon)"/>
  <path d="M138 84 L142 104" stroke="url(#goldIcon)" stroke-width="4" stroke-linecap="round"/>

  <!-- Pill Typography Base -->
  <rect x="36" y="142" width="128" height="26" rx="13" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="100" y="159" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    ALTUM TRACK
  </text>
</svg>
